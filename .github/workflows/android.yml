name: Build CODM Skin Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK Components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Check Project Files
        run: |
          echo "Checking Android project..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/demo/codmskinstudio/MainActivity.java

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-Skin-Studio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
